name: CI/CD Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pruebas unitarias con cobertura
        run: pytest -v --cov=app --cov-report=term
      - name: Calcular métrica del modelo
        run: |
          python -m app.modelo
          cat metrics.json
      - name: Guardar métricas como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: metricas
          path: metrics.json

  docker:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Construir y subir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-docker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-docker:${{ github.sha }}
      - name: Ejecutar el contenedor
        run: docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/proyecto-docker:latest
